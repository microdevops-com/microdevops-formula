# Generic appsvc preset - reference template for the full supported feature set.
#
# This preset is intentionally inert by default: it documents the available
# settings without declaring an active `svc`, `config`, `commands`, `ssh`, or
# nginx vhost. Copy only the parts you need into an instance or a
# `appsvc:presets:generic` override. Any `{placeholder}` string below is resolved
# by init.sls's two-pass expand pipeline.
#
# Common placeholders:
#   {name}          instance key under appsvc:instances
#   {type}          preset name, or {name} if no preset is used
#   {version}       svc.version after resolver runs
#   {tag}           release tag, usually == version
#   {tag_vstrip}    {tag} without a leading "v"
#   {osarch}        normalized arch: amd64, arm64, ...
#   {kernel_lower}  lowercased kernel grain
#   {cpuarch}       cpuarch grain
#   {grain_id}      minion id (grains:id)
#   {install_dir}   resolved install_dir
#   {exec}          resolved svc.exec
#   {args}          svc.args rendered with svc.args_prefix, or raw string args
#   {user_name}     resolved user.name, default root
#   {user_group}    resolved user.group, default {user_name}
#   {svc_target}    resolved fetch destination (kind: file's target, or the
#                   would-be one) when svc.source is set, else ""
#   {home}          user.home if set, else /root for root, else /home/<user.name>
#   {venv_dir}      resolved venv.dir, e.g. "{install_dir}/venv" - NOT {venv},
#                   which would render the whole venv config dict's repr
#   {nvm_dir} {pyenv_root} {tools_dir} {env_sh}
#                   runtime paths: per-user under {home} for a non-root user.name,
#                   global (/usr/local/..., /etc/profile.d/appsvc-<name>.sh) for
#                   root; explicit nvm.dir / pyenv.root / shell_env.path win
#   plus any key from appsvc:globals (top-level pillar), e.g. {foo} below

type: generic

# Global/default-level knobs. Usually keep these in defaults.yaml or top-level
# pillar, not per preset.
#
# cache_dir: /var/cache/salt/appsvc
# resolve_cache_ttl: 3600
# install_dir: "/opt/services/{type}/{name}"   # required, no default: a path,
#                       # or null for an instance with no directory of its own
# install_dir: {name: "/var/www/{name}/app", group: www-data, mode: "750"}  # string or
#                       # {name, user, group, mode}; mode is the dir itself, never recursive
# github_token: ghp_xxxxxxxxxxxxxxxxxxxx  # top-level appsvc pillar only; secret

# Service user. `user.manage: false` means "run as an externally-managed user".
# Extra keys accepted by Salt's user.present can be passed through here, except
# manage/name/group/groups which appsvc handles explicitly.
user:
  manage: false
  name: root
  group: root
  # home: "/opt/services/{type}"
  # home: {name: "/var/www/{name}", group: www-data, mode: "750"}  # per-site
  #                       # isolation (readme: Directory isolation); name optional
  # groups:
  #   - adm
  # shell: /usr/sbin/nologin
  # system: true

# Optional SSH identity for the managed user. This block only runs when
# `user.manage: true`.
#
# ssh:
#   keys:
#     id_ed25519: |
#       -----BEGIN OPENSSH PRIVATE KEY-----
#       ...
#       -----END OPENSSH PRIVATE KEY-----
#   authorized_keys:
#     - "ssh-ed25519 AAAA... operator@example"
#   config: |
#     Host github.com
#       StrictHostKeyChecking yes
#   known_hosts:
#     timeout: 5
#     config: "{install_dir}/.ssh/known_hosts"
#     # entries are "host:port[:enc[:key]]"; enc defaults to ssh-ed25519.
#     hosts:
#       - "github.com:22:ssh-ed25519:AAAA..."

# Fetch. Declare this block when the instance should download and install a
# binary, archive, or bare script. `version_resolver` controls only how
# version/source are resolved; fetching itself picks one of two KINDS.
#
# `svc.kind` (optional) picks the fetch strategy explicitly: "archive" or
# "file". Left unset, it's inferred: `svc.tar` present, or the source's
# basename ends in a recognized archive suffix (.tar.gz/.tgz/.tar.bz2/.tbz2/
# .tar.xz/.txz/.tar.zst/.tar) -> archive; a *recognized-but-unsupported*
# archive suffix (.zip/.7z/.rar/.gz/.bz2/.xz - appsvc extracts with `tar` only)
# raises rather than silently mis-fetching; otherwise -> file. Set svc.kind
# explicitly whenever the inference could be ambiguous (e.g. a URL with no
# extension that is actually an archive).
#
# svc:
#   # github: resolves `version: latest` via GitHub /releases/latest and needs
#   # `source` as a URL template containing {tag}. Concrete versions keep the
#   # provided source as-is.
#   version_resolver: github
#   version: latest
#   source: "https://github.com/owner/repo/releases/download/{tag}/app-linux-{osarch}-{tag}.tar.gz"
#
#   # github_versionsort: lists GitHub releases and picks the highest
#   # semver-like tag. Use for repos whose /releases/latest can point at an LTS
#   # branch instead of the highest current version.
#   # version_resolver: github_versionsort
#
#   # Optional integrity check. Without it, fetch sets skip_verify=True. May be
#   # a sha256=... value or a checksum-file URL supported by Salt. Works for
#   # both kinds.
#   source_hash: "https://github.com/owner/repo/releases/download/{tag}/app-linux-{osarch}-{tag}_checksums.txt"
#
#   # grafana: resolves latest/concrete versions through grafana.com packages API
#   # and fills source/source_hash itself. Keep source empty/omitted there.
#   # version_resolver: grafana
#   # version: latest
#
#   # --- kind: archive (this preset's default shape below) ---
#
#   # If omitted, the downloaded file itself is treated as the executable input.
#   tar:
#     # Extra tar flags, e.g. strip the top archive directory.
#     args: "--strip-components 1"
#     # Optional member/path to extract. May use {file} in this block.
#     unpack: "app-{tag}"
#
#   # Optional post-extract rename/move. {file} is the local cached archive path.
#   move:
#     src: "{install_dir}/app"
#     dst: "{install_dir}/bin/app"
#
#   # First token is used for executable chmod and as {binary} in version_check,
#   # unless svc.executable overrides it (see below).
#   exec: "{install_dir}/bin/app"
#
#   # Opt-in idempotency guard for extraction. Exit 0 means "already current".
#   # With neither version_check nor version_stamp, extraction reports changed
#   # every run and systemd restarts every run. {binary} and {file} are filled
#   # by fetch; the rest ({tag}/{install_dir}/...) is already resolved.
#   version_check: "[[ $({binary} -version 2>&1) =~ {tag} ]]"
#
#   # Generic idempotency fallback for binaries with no `--version` flag (e.g.
#   # a source tarball with only scripts): when set and version_check is NOT,
#   # fetch itself writes {install_dir}/.appsvc_version after a successful
#   # extract and compares against it on the next run - no hand-rolled stamp
#   # command needed. Ignored (and irrelevant) when version_check is set.
#   # version_stamp: true
#
#   # Path to chmod 755 after fetching. Defaults to exec's first token; a
#   # Python-from-tarball instance (exec starting with "{venv_dir}/bin/python")
#   # needs this explicitly false/null, since that first token doesn't exist
#   # yet at fetch time and would hard-fail the chmod.
#   # executable: false
#
#   # Args may be a top-level raw string, mapping, or ordered list mixing
#   # single-key mappings with literal string tokens such as "--livereload".
#   # Structured args render as "{args_prefix}key=value"; args_prefix defaults
#   # to "-" and can be set to "--" for long-form CLIs. A mapping key with a null
#   # value renders as a bare flag (YAML `- foobar:` -> "{args_prefix}foobar"),
#   # so value-less flags need not be quoted strings. String list entries are
#   # used as-is. Preset and instance svc.args merge by flag name unless a layer
#   # is a top-level string or repeats a flag, in which case the later layer
#   # replaces wholesale.
#   args_prefix: "-"
#   args:
#     - web.listen-address: "127.0.0.1:9000"
#     - livereload:                          # bare flag -> --livereload
#     - storage.path: "{install_dir}/data"
#
#   # Writable dirs shipped or needed by the service. These become service-user
#   # owned after fetching (either kind); program files stay root-owned.
#   data_dirs:
#     - "{install_dir}/data"

# --- kind: file - a single script or bare binary, no archive at all ---
#
# svc:
#   source: "https://example.com/downloads/redis_check.py"   # or salt://...
#   # Destination path. Defaults to "{install_dir}/<source's basename>" when
#   # omitted - set it explicitly when the source's basename isn't the name you
#   # want on disk.
#   target: "{install_dir}/redis_check.py"
#   mode: "755"          # default 755
#   # No version_check/version_stamp needed for kind: file - File.managed
#   # compares content hashes itself and reports "changed" only when the
#   # fetched content actually differs. tar/move/version_check/version_stamp/
#   # executable are archive-only and fetch raises if any is set here.

# Managed Python venv, for a Python-based daemon. Top-level `venv:` key (not
# svc.venv) - a PyPI-distributed daemon (requirements: [some-exporter], no
# svc block at all) is a valid instance. Runs after fetch in dispatch, so
# requirements_files can point at a requirements.txt shipped inside a fetched
# archive. See presets/redis_check.yaml for a real consumer.
#
# venv:
#   manage: true
#   dir: "{install_dir}/venv"     # default; self-resolves through install_dir
#   python: python3               # python3.11, a deadsnakes build, ... - never
#                                  # bare "python", stock Debian has none
#   pkgs: [python3-venv]          # add python3-dev/build-essential for C exts
#   recreate_on_change: true      # rebuild with --clear when requirements change;
#                                  # false only forces a fresh venv on a
#                                  # missing/wrong-version interpreter and
#                                  # otherwise reuses it (pip install in place)
#   upgrade_pip: false
#   pip_args: ""                  # --no-cache-dir, --index-url, ...
#   requirements:                 # inline; written to {install_dir}/.appsvc-requirements.txt
#     - "redis>=4.2"
#     - "PyYAML>=5.0"
#   requirements_files: []        # e.g. ["{install_dir}/requirements.txt"] shipped in an archive
#
# The command line then follows the same convention as every other preset -
# declared once as svc.exec, referenced by ExecStart. Nested placeholders are
# fine: expand() re-folds its own output each round, so {exec} resolves to
# "{venv_dir}/bin/python {svc_target}" and then to concrete paths.
#
# svc:
#   exec: "{venv_dir}/bin/python {svc_target}"
# systemd:
#   units:
#     main:
#       Service:
#         ExecStart: "{exec} {args}"
#
# (Inlining "{venv_dir}/bin/python {svc_target}" straight into ExecStart also
# works, but skips svc.args and breaks the one-place-for-the-command-line
# convention - prefer svc.exec.)
#
# Idempotency: a single Cmd.run `unless`-guarded by a sha256 digest of the
# interpreter version + pip_args + every requirements file's content, computed
# on the MINION at runtime (not render time, since a requirements.txt can
# arrive inside an archive). Stamped inside {venv_dir} only after a successful
# install, so a failed pip install leaves no stamp and retries next run. The
# venv is root-owned, like fetched program files; writable state still goes
# through svc.data_dirs.

# Config files. Each named entry renders one File.managed and contributes to the
# systemd restart watch list. Use either `contents` or `source`. The entry key is
# available within the entry as {confname}, so a filename can be declared once
# (as the key) instead of repeated in `name`.
#
# config:
#   config.yml:                 # {confname} == "config.yml"
#     name: "{install_dir}/{confname}"
#     format: yaml              # yaml (default), yml, ini, json
#     user: "{user_name}"       # defaults to service user/root
#     group: "{user_group}"     # defaults to service group/root
#     mode: "640"               # default 644
#     makedirs: true            # default true
#     contents:
#       server:
#         listen: "127.0.0.1:9000"
#   main_ini:
#     name: "{install_dir}/app.ini"
#     format: ini
#     contents:
#       server:
#         http_port: 9000
#   main_json:
#     name: "{install_dir}/config.json"
#     format: json
#     contents:
#       enabled: true
#   templated:
#     name: "{install_dir}/extra.conf"
#     source: salt://my-formula/files/extra.conf.jinja
#     template: jinja           # default jinja when source is used

# Writable / working directories (keyed map; does not replace svc.data_dirs).
# A string value is shorthand for {name: <path>}. Runs after install_dir and
# before sources, so a checkout's parent exists. A dir INSIDE a sources target
# fails loud at render (it would block the clone) - create such a directory with
# a `commands` entry using `onchanges: [sources:<key>]`, or place it outside the
# checkout.
#
# dirs:
#   sessions: /var/lib/php/app-sessions
#   logs:
#     name: "{home}/log"        # required, absolute after expansion
#     user: "{user_name}"       # default: instance user name (root if unmanaged)
#     group: "{user_group}"     # default: instance user group
#     mode: "750"               # default "755"; MUST be a quoted string
#     makedirs: true            # default true
#     recurse: false            # true -> recurse=[user, group] (never mode)

# Language runtimes, installed per user when user.name is not root and globally
# (/usr/local) when it is. They run right after dirs, before sources/venv/
# commands, and their refs join `changed`. appsvc never installs node or python
# any other way. `versions` are lists, not keyed maps: the set is atomic and
# ordered (the first entry is the default), so a merge replaces it wholesale.
# Every version MUST be a quoted string (unquoted 3.10 is the float 3.1; unquoted
# 20 is an int) - anything else fails the render. Without `versions` the blocks
# do nothing (rev/repo/build_pkgs defaults live in defaults.yaml).
#
# nvm:
#   versions: ["20"]            # first = `nvm alias default`
#   rev: v0.40.1                # nvm git tag (default in defaults.yaml)
#   # dir: "{home}/.nvm"        # default {nvm_dir}
#   # repo: https://github.com/nvm-sh/nvm.git
#   # build_pkgs: [git, curl]   # default in defaults.yaml; [] skips
#
# pyenv:
#   versions: ["3.8.13"]        # first = `pyenv global`
#   rev: v2.4.0
#   # root: "{home}/.pyenv"     # default {pyenv_root}
#   # repo: https://github.com/pyenv/pyenv.git
#   # build_pkgs: [git, curl, build-essential, ...]   # default list in defaults.yaml; [] skips
#
# Single-file downloads (keyed map), e.g. composer.
# tools:
#   composer:
#     source: https://getcomposer.org/download/2.6.6/composer.phar
#     source_hash: https://getcomposer.org/download/2.6.6/composer.phar.sha256sum  # else unverified
#     # target: "{tools_dir}/composer"   # default {tools_dir}/<key>
#     # mode: "755"                      # default; must be a string
#
# env_sh: when any of nvm/pyenv/tools is active, one file ({env_sh}) puts them on
# PATH. Use it in commands: cmd: ". {env_sh} && composer install". For a non-root
# user a source line is PREPENDED to {home}/.bashrc (Ubuntu's .bashrc returns
# early for non-interactive shells, e.g. CI's `ssh user@host '<cmd>'`).
# shell_env:                      # settings key; {env_sh} is the resolved path
#   path: "{env_sh}"              # default shown by layout; override here
#   profile: "{home}/.bashrc"     # default for non-root; false disables; root: none
#
# venv.python can point at a pyenv interpreter:
#   venv: {python: "{pyenv_root}/versions/3.8.13/bin/python"}

# Git checkouts (keyed map; the key becomes part of a state ID: [A-Za-z0-9_.-]+).
# Runs before config, so a config entry can write into a checkout (.env.local);
# such a config entry (its `name` inside a source target) automatically
# `require`s that source, so a failed clone skips it instead of leaving a
# makedirs-created target behind.
# A change restarts the service (unless once: true, where only the first clone
# counts) and can gate commands via `onchanges` below.
#
# sources:
#   backend:
#     git: git@gitlab.example.com:group/backend.git   # required
#     target: "{home}/backend"    # required, absolute after expansion (no ~)
#     once: false                 # true -> git.cloned: clone if missing, never update
#     branch: master              # optional
#     identity: "{home}/.ssh/id_ed25519"   # optional
#     # git.latest-only (rejected together with once: true):
#     rev: master
#     depth: 1
#     submodules: false
#     force_reset: false          # NOT defaulted to true (unlike app.*): with
#                                 # false a dirty tree fails loud rather than
#                                 # silently discarding local changes
#     force_checkout: false
#     force_clone: false
#     force_fetch: false

# Cron entries (keyed map), tagged with identifier appsvc_<instance>_<key>.
# Runs after the post commands. REMOVING an entry from pillar does NOT remove
# it from the crontab - set `absent: true` for a run to delete it.
#
# cron:
#   session_clean:
#     schedule: "0 * * * *"     # five fields, or one @special (@daily, @reboot, ...)
#     cmd: "find /var/lib/php/app-sessions -mtime +10 -delete"
#     user: root                # default: instance user name
#     comment: "..."            # optional
#     disabled: false           # optional -> commented: true
#     absent: false             # true -> Cron.absent (cmd/schedule then optional)

# One-shot commands. Entries run in declaration order, never feed the
# fetch/config changed -> systemd restart contract, and should carry their own
# `unless` or `onlyif` when they must be idempotent.
#
# commands:
#   pre_setup:
#     # Required command string. It is placeholder-expanded before dispatch.
#     cmd: "install -d -m 0750 -o {user_name} -g {user_group} {install_dir}/state"
#     # Optional phase: pre runs after fetch/config and before systemd; post
#     # runs after systemd is running. Default is post.
#     phase: pre
#     # Optional gate: skip the entry unless this top-level settings key exists
#     # and is truthy. Useful for semantic inputs like admin_password.
#     when_set: setup_enabled
#     # Optional Salt cmd.run passthroughs supported by the block.
#     cwd: "{install_dir}"
#     runas: "{user_name}"
#     unless: "test -d {install_dir}/state"
#     onlyif: "test -x {exec}"
#     env:
#       APP_HOME: "{install_dir}"
#     output_loglevel: info
#   post_secret:
#     cmd: "{exec} admin reset-password --password-from-stdin"
#     phase: post
#     when_set: admin_password
#     # stdin is preferred for secrets. The block defaults output_loglevel to
#     # quiet whenever stdin is present, unless explicitly overridden.
#     stdin: "{admin_password}"
#   backend_deps:
#     cmd: "composer install --no-dev --optimize-autoloader"
#     cwd: "{home}/backend"
#     runas: "{user_name}"      # runas is never defaulted
#     phase: pre                # onchanges composes with phase (when in the run)
#     # Run only when a source changed: [sources:<key>, ...], or [sources] for
#     # any source. Must be a non-empty list; an unknown key, or [sources]
#     # with no sources declared, fails the render.
#     # TRAP: if the first run fails, the command will NOT run again until the
#     # source changes again (the git state already reported its change).
#     # Re-run it by hand, or temporarily drop `onchanges`. With `once: true`
#     # sources it runs exactly once, on the initial clone.
#     onchanges: [sources:backend]

# systemd units: a keyed map, one /etc/systemd/system/<name>.service per key.
# No units -> nothing is rendered (this reference preset stays inert as-is).
# `systemd.manage: false` turns off all of an instance's units (e.g. a preset's).
# Each unit is merged over systemd.defaults (defaults.yaml: Description, restart
# cap, Restart/RestartSec, WorkingDirectory, WantedBy), so it mostly needs an
# ExecStart. Sections render as INI; list values render as repeated directives.
# Every kept unit restarts when code/binary/config/runtimes change. Bundled
# presets name their single `main` unit "appsvc_{name}" - override it there:
# systemd.units.main.Service.LimitNOFILE: 65536.
#
# Placeholders: {unit} is the key, {unit_name} the resolved unit name (only
# inside systemd.units.<unit>).
#
# BREAKING in 0.2 (was systemd.{Unit,Service,Install,unit} for one unit): the
# old keys fail the render with a pointer to CHANGELOG.md#0.2-systemd-units.
#
# systemd:
#   manage: true
#   # defaults:
#   #   name: "appsvc_{name}_{unit}"     # default unit name (defaults.yaml)
#   units:
#     main:
#       name: "appsvc_{name}"            # unit name, ".service" optional; default
#                                        # systemd.defaults.name. Must be unique on
#                                        # the host (checked across instances), no
#                                        # other suffix, no `@`, no distro names
#                                        # (nginx, php*-fpm, redis-server, ...).
#       Unit:
#         After:
#           - network.target
#           - local-fs.target
#       Service:
#         ExecStart: "{exec} {args}"
#         User: "{user_name}"
#         Group: "{user_group}"
#     consumer:                          # -> appsvc_<instance>_consumer.service
#       Unit:
#         Description: "appsvc: {name} consumer ({unit_name})"
#       Service:
#         ExecStart: "/usr/bin/php {install_dir}/bin/console messenger:consume async"
#         User: "{user_name}"
#     # A unit dropped from pillar stays on the host untouched. To remove one,
#     # keep its key with delete: true - stopped, disabled, file removed, once.
#     # old_worker: {delete: true}

# Optional nginx vhosts: `vhosts` is a keyed map, one server group per key (the
# key becomes part of a state ID: [A-Za-z0-9_.-]+). `manage` is the on/off gate.
# Each vhost uses EXACTLY ONE of `upstream` (built-in reverse-proxy template) or
# `template` (a custom jinja file). ACME DNS vhosts set only `acme_account`;
# appsvc derives cert paths /opt/acme/cert/<name>_<first-name>_* and expects the
# account to be managed by the separate acme state/pillar (DNS accounts only -
# webroot accounts are not supported yet). `auth_basic` passwords should live in
# secured or encrypted pillar; the current implementation rewrites htpasswd
# entries. One `nginx -t && nginx -s reload` runs per instance, when any vhost
# file/symlink changed.
#
# BREAKING (was nginx.{vhost_name,upstream,servers,auth_basic}): the old
# top-level keys now fail loud. Migrate to
#   nginx: {manage: true, vhosts: {<key>: {name: <old vhost_name>, upstream: <U>,
#           names: [...], acme_account: ...}}}
# - `name:` keeps the same sites-available file and ACME cert path.
nginx:
  manage: false
  # vhosts:
  #   app:
  #     # name: "{name}_app"        # default "<instance>_<key>": file, upstream,
  #     #                           # ACME and log name
  #     names: [app.example.com]    # required, non-empty list
  #     acme_account: example_com   # OR ssl_cert + ssl_key, OR neither (plain :80)
  #     # ssl_cert: /etc/ssl/certs/app.fullchain.pem
  #     # ssl_key: /etc/ssl/private/app.key
  #     upstream: "127.0.0.1:9000"  # built-in reverse proxy ...
  #     # template: salt://my-formula/nginx/app.conf   # ... OR a custom jinja file
  #     # vars: {centrifugo_port: 8012}   # custom template only: extra context.
  #     #   Template context: vhost_name, domain (names joined by space), names,
  #     #   ssl_cert, ssl_key ("" without TLS), access_log, error_log,
  #     #   htpasswd_file ("" without auth_basic), php_fpm_sockets
  #     #   ({pool_key: socket} from php_fpm.pools), then `vars` on top
  #     #   (a vars key shadowing one of those names fails loud).
  #     # log:                     # each one optional
  #     #   access: /var/log/nginx/<name>.access.log    # default
  #     #   error: /var/log/nginx/<name>.error.log      # default
  #     # auth_basic:
  #     #   - username: admin
  #     #     password: change-me

# logrotate: one /etc/logrotate.d/appsvc-<instance> composed from the logs
# declared above and below - php_fpm pool log.error/log.slow and nginx vhost
# log.access/log.error. Nothing to list; these are only tunables (defaults.yaml):
# logrotate:
#   manage: true                 # false: don't write (or remove) the file
#   rotate: 31
#   frequency: daily             # hourly|daily|weekly|monthly|yearly
#   mode: "640"                  # create <mode> <user.name> <user.group>
#   skip:                        # globs left out (already rotated elsewhere;
#     - /var/log/nginx/*.log     # logrotate aborts on a log listed twice)

# php-fpm pools (keyed map). appsvc NEVER installs PHP - the php<ver>-fpm
# package is another state's job. One pool.d file per pool plus one
# `php-fpm<ver> -t && systemctl reload php<ver>-fpm` per distinct version, only
# when a pool file changed (php-fpm is not the instance's systemd unit, so this
# never restarts the service). REMOVING a pool from pillar does NOT delete its
# file. Each pool's socket is handed to nginx custom templates as
# php_fpm_sockets.<pool key>. Reloading for a code change (opcache) is not done
# here - deploys own it.
#
# php_fpm:
#   pools:
#     web:
#       version: "8.3"              # required; MUST be a quoted string ("8.10" != 8.1)
#       # name: "{name}_web"        # default "<instance>_<key>": [section] + file name
#       # user: "{user_name}"       # default: the instance user
#       # group: "{user_group}"
#       # listen: "/run/php/php{version}-fpm-{pool_name}.sock"   # default
#       # listen_owner: www-data
#       # listen_group: www-data
#       # listen_mode: "0660"       # a string
#       log:                        # optional, each key too
#         error: "{install_dir}/log/php/web.error.log"     # php_admin_value[error_log]
#         slow: "{install_dir}/log/php/web.slow.log"       # php-fpm slowlog
#         # slow_timeout: 10          # default when slow is set: seconds, or "5s"/"1m"
#         # slow_trace_depth: 0       # default when slow is set
#       # reload: true              # default true
#       config: |                   # raw lines appended verbatim
#         pm = dynamic
#         pm.max_children = 20

# Top-level semantic values are allowed and become visible to placeholder
# expansion because expand folds top-level settings keys into scope. Presets can
# use this to expose friendly inputs over generic mechanisms.
#
# admin_password: "change-me"
# setup_enabled: true
