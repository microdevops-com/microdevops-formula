cache_dir: /var/cache/salt/appsvc

# TTL (seconds) for the on-disk cache of version/source API responses, shared
# across render processes on the render host. Collapses a many-minion highstate
# (or repeated salt-ssh runs) into one API call per URL per window, and lets a
# stale entry be served if a refresh fails. 0 disables caching (direct request
# every time). Does NOT help minions rendering behind a shared NAT egress IP -
# see WHITEPAPER.md §10.
resolve_cache_ttl: 3600

install_dir: "/opt/services/{type}/{name}"

# Managed Python venv for a Python-based daemon. block runs only when
# venv.manage is true (like user/nginx). Top-level, not svc.venv - a
# PyPI-distributed daemon (requirements: [some-exporter]) is a valid instance
# with no svc block at all. See blocks/venv.sls and WHITEPAPER.md §6.
venv:
  manage: false
  dir: "{install_dir}/venv"
  python: python3            # python3.11, a deadsnakes build, ...
  pkgs: [python3-venv]       # add python3-dev/build-essential for C extensions
  recreate_on_change: true   # rebuild with --clear when the requirement set changes
  upgrade_pip: false
  pip_args: ""               # --no-cache-dir, --index-url, ...
  requirements: []           # inline, from preset/pillar
  requirements_files: []     # e.g. ["{install_dir}/requirements.txt"] shipped in an archive

user:
  manage: false
  name: root
  group: root

nginx:
  manage: false

# One /etc/logrotate.d/appsvc-<instance> composed from the declared php pool
# error_logs and nginx vhost logs (blocks/logrotate.sls). Inert until one of
# those exists outside `skip`.
logrotate:
  manage: true
  rotate: 31
  frequency: daily
  mode: "640"
  # The distro's /etc/logrotate.d/nginx already rotates these; logrotate
  # aborts on a log listed by two configs.
  skip:
    - /var/log/nginx/*.log

systemd:
  manage: true
  # Merged under every systemd.units.<unit> entry (the entry wins). `name` is
  # the systemd unit name; {unit} is the entry's key, {unit_name} the resolved
  # name. Bundled presets pin name: "appsvc_{name}" on their `main` unit.
  defaults:
    name: "appsvc_{name}_{unit}"
    Unit:
      Description: "appsvc: {type} ({name})"
      After: network.target
      # Cap auto-restarts: give up after StartLimitBurst starts within
      # StartLimitIntervalSec, instead of looping forever. These belong in [Unit]
      # (systemd ignores them under [Service]). The interval must comfortably
      # exceed StartLimitBurst * RestartSec (5 * 10s = 50s) so all attempts fall
      # in one window and the limit actually trips.
      StartLimitIntervalSec: 60
      StartLimitBurst: 5
    Service:
      Type: simple
      Restart: on-failure
      # Wait 10s between restarts instead of hammering instantly.
      RestartSec: 10
      WorkingDirectory: "{install_dir}"
    Install:
      WantedBy: multi-user.target

# nvm / pyenv: defaults only supply rev/repo/build_pkgs (`build_pkgs: []` skips
# the package state). The blocks do nothing until an instance sets `versions` (a
# list of QUOTED strings, first = default), so these stay inert. See
# blocks/nvm.sls, blocks/pyenv.sls.
nvm:
  rev: v0.40.1
  repo: https://github.com/nvm-sh/nvm.git
  # git clones nvm; curl downloads node tarballs.
  build_pkgs: [git, curl]

pyenv:
  rev: v2.4.0
  repo: https://github.com/pyenv/pyenv.git
  # https://github.com/pyenv/pyenv/wiki#suggested-build-environment (make comes
  # with build-essential; libzstd-dev is for Python 3.14+).
  build_pkgs: [git, curl, build-essential, libssl-dev, zlib1g-dev, libbz2-dev,
               libreadline-dev, libsqlite3-dev, libncursesw5-dev, xz-utils, tk-dev,
               libxml2-dev, libxmlsec1-dev, libffi-dev, liblzma-dev, libzstd-dev]
